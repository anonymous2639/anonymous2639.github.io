<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning to Make Way for Navigation Among Movable Obstacles through Guided Search</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#ffffff; --fg:#16181a; --muted:#5d6468; --border:#e3e6e3;
  --accent:#12924b; --accent-soft:#e8f6ee;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111314; --fg:#e8eaea; --muted:#9aa2a4; --border:#2b2f30;
    --accent:#4ad07f; --accent-soft:#16291f;
  }
}
:root[data-theme="dark"]{
  --bg:#111314; --fg:#e8eaea; --muted:#9aa2a4; --border:#2b2f30;
  --accent:#4ad07f; --accent-soft:#16291f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
}
main{max-width:620px; padding-inline:24px; padding-block:64px; text-align:center}
h1{
  font-size:clamp(1.3rem,4vw,1.75rem); line-height:1.3; font-weight:650;
  letter-spacing:-0.015em; margin:0 0 14px;
}
.venue{color:var(--muted); font-size:.95rem; margin:0}
.tag{
  display:inline-block; margin-top:20px; padding:7px 14px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--border);
  font-size:.83rem; letter-spacing:.02em;
}
.note{
  margin:32px 0 0; padding-top:26px; border-top:1px solid var(--border);
  color:var(--muted); font-size:.92rem;
}
</style>
</head>
<body>
<main>
  <h1>Learning to Make Way for Navigation Among Movable Obstacles through Guided Search</h1>
  <p class="venue">Anonymous submission &middot; ICRA 2027</p>
  <span class="tag">Anonymized project page for double-blind review</span>
  <p class="note">This page is under construction. Figures, quantitative results, and hardware videos will be posted here.</p>
</main>
</body>
</html>
